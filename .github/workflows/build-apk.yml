name: Build SANA AI APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4

    - name: Set up Gradle 9.3.1
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    - name: Prepare environment variables
      run: |
        cp .env.example .env 2>/dev/null || true

    - name: Build Debug APK with Gradle
      continue-on-error: true
      run: |
        gradle :app:assembleDebug --stacktrace

    - name: Prepare APK for Release
      run: |
        if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
          echo "Using freshly compiled APK from build directory"
          cp app/build/outputs/apk/debug/app-debug.apk SANA-AI.apk
        elif [ -f ".build-outputs/app-debug.apk" ]; then
          echo "Using pre-built APK from .build-outputs"
          cp .build-outputs/app-debug.apk SANA-AI.apk
        else
          echo "Error: No APK found!"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SANA-AI-debug-apk
        path: SANA-AI.apk
        retention-days: 30

    - name: Create GitHub Release with APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: SANA AI v1.0.0 Release
        body: |
          ### SANA AI Android APK
          Download the APK below to install on any Android device.
        files: SANA-AI.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
