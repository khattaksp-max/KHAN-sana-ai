name: Build SANA AI APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Prepare environment variables
      run: |
        cp .env.example .env || true

    - name: Build Debug APK with Gradle
      run: gradle :app:assembleDebug

    - name: Prepare APK for Release
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk SANA-AI.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SANA-AI-debug-apk
        path: SANA-AI.apk
        retention-days: 30

    - name: Create GitHub Release with APK
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v1.0.0
        name: SANA AI v1.0.0 Release
        body: |
          ### SANA AI Android APK
          Download the pre-compiled APK below to install on any Android device.
        files: SANA-AI.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
